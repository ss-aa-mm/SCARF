<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <link th:href="@{/images/favicon.ico}" rel="icon" type="image/x-icon"/>
  <link th:href="@{/images/favicon.png}" rel="icon" type="image/png" sizes="32x32"/>
  <link th:href="@{/css/output.css}" rel="stylesheet"/>
  <title>SCARF - Simulation Results</title>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Header matching original results.html -->
<header class="bg-white border-b border-gray-100 p-4 flex items-center justify-between sticky top-0 z-50">
  <div class="flex items-center gap-3">
    <div class="p-1.5 bg-blue-50 rounded-lg">
      <img th:src="@{/images/favicon.png}" alt="SCARF Logo" class="w-10 h-10 rounded-md">
    </div>
    <div>
      <h1 class="text-xl font-extrabold tracking-tight text-gray-900">SCARF</h1>
      <p class="text-[10px] text-blue-600 font-bold uppercase tracking-widest">SaaS Carbon-Aware Reasoning Framework</p>
    </div>
  </div>
  <div class="flex items-center gap-4">
    <span class="text-xs font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full">
        Simulation ID: <span class="font-bold text-gray-800" th:text="${resultId ?: 'Unknown'}"></span>
    </span>
    <a th:href="@{/}" class="text-blue-600 hover:text-blue-800 transition-colors" title="Home">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
    </a>
  </div>
</header>

<main class="max-w-6xl mx-auto p-8 flex flex-col gap-8">

  <!-- Interactive Section Switcher -->
  <div class="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-1.5 h-6 bg-purple-600 rounded-full"></div>
      <h2 class="font-bold text-gray-800 text-lg">Simulation Results</h2>
    </div>

    <div class="inline-flex rounded-lg shadow-sm bg-gray-100 p-1" role="tablist">
      <button id="tab-btn-interaction" onclick="switchTab('interaction')"
              class="px-5 py-2 text-xs font-bold uppercase tracking-tight rounded-md transition-all bg-white text-blue-600 shadow-sm cursor-pointer">
        Interaction Analysis
      </button>
      <button id="tab-btn-device" onclick="switchTab('device')"
              class="px-5 py-2 text-xs font-bold uppercase tracking-tight rounded-md transition-all text-gray-500 hover:text-gray-700 cursor-pointer">
        Device Analysis
      </button>
    </div>
  </div>

  <!-- Interaction View -->
  <section id="view-interaction" class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col gap-4">
    <div class="flex items-center justify-between pb-4 border-b border-gray-50">
      <div>
        <h3 class="font-bold text-gray-800 text-base">Carbon Analysis per Interaction</h3>
        <p class="text-xs text-gray-500">Distribution of SCI across interactions</p>
      </div>
      <a th:href="@{|/generated-plots/${resultId}/interaction.pdf|}" download
         class="inline-flex items-center gap-2 text-xs font-semibold text-blue-600 hover:text-blue-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        Download High-Res
      </a>
    </div>
    <div class="w-full overflow-hidden rounded-xl bg-gray-50 flex justify-center p-4">
      <img th:src="@{|/generated-plots/${resultId}/interaction.png|}"
           alt="Interaction Carbon Analysis Plot"
           class="max-w-full h-auto object-contain rounded-lg shadow-sm">
    </div>
  </section>

  <!-- Device View (Hidden by default) -->
  <section id="view-device" class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col gap-4 hidden">
    <div class="flex items-center justify-between pb-4 border-b border-gray-50">
      <div>
        <h3 class="font-bold text-gray-800 text-base">Device SCI vs. Utilization</h3>
        <p class="text-xs text-gray-500">Analysis of device-level carbon impact and resource utilization</p>
      </div>
      <a th:href="@{|/generated-plots/${resultId}/device.pdf|}" download
         class="inline-flex items-center gap-2 text-xs font-semibold text-blue-600 hover:text-blue-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
        </svg>
        Download High-Res
      </a>
    </div>
    <div class="w-full overflow-hidden rounded-xl bg-gray-50 flex justify-center p-4">
      <img th:src="@{|/generated-plots/${resultId}/device.png|}"
           alt="Device Utilization Tradeoff Plot"
           class="max-w-full h-auto object-contain rounded-lg shadow-sm">
    </div>
  </section>

</main>

<script>
  function switchTab(tab) {
    const interactionView = document.getElementById('view-interaction');
    const deviceView = document.getElementById('view-device');
    const btnInteraction = document.getElementById('tab-btn-interaction');
    const btnDevice = document.getElementById('tab-btn-device');

    if (tab === 'interaction') {
      interactionView.classList.remove('hidden');
      deviceView.classList.add('hidden');

      btnInteraction.className = "px-5 py-2 text-xs font-bold uppercase tracking-tight rounded-md transition-all bg-white text-blue-600 shadow-sm cursor-pointer";
      btnDevice.className = "px-5 py-2 text-xs font-bold uppercase tracking-tight rounded-md transition-all text-gray-500 hover:text-gray-700 cursor-pointer";
    } else {
      deviceView.classList.remove('hidden');
      interactionView.classList.add('hidden');

      btnDevice.className = "px-5 py-2 text-xs font-bold uppercase tracking-tight rounded-md transition-all bg-white text-blue-600 shadow-sm cursor-pointer";
      btnInteraction.className = "px-5 py-2 text-xs font-bold uppercase tracking-tight rounded-md transition-all text-gray-500 hover:text-gray-700 cursor-pointer";
    }
  }
</script>

</body>
</html>
