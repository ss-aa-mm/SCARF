<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link th:href="@{/images/favicon.ico}" rel="icon" type="image/x-icon"/>
  <link th:href="@{/images/favicon.png}" rel="icon" type="image/png" sizes="32x32"/>
  <link th:href="@{/css/output.css}" rel="stylesheet"/>
  <script th:src="@{/js/vendor/d3.min.js}"></script>
  <script th:src="@{/js/vendor/topojson.min.js}"></script>
  <script th:src="@{/js/scarf.js}"></script>
  <script th:src="@{/js/solar-time-picker.js}"></script>
  <script th:src="@{/js/routing-gauge.js}"></script>
  <title>SCARF</title>
</head>

<body>
<header class="bg-white border-b border-gray-100 p-4 flex items-center justify-between sticky top-0 z-50">
  <div class="flex items-center gap-3">
    <div class="p-1.5 bg-blue-50 rounded-lg">
      <img th:src="@{/images/favicon.png}" alt="SCARF Logo" class="w-10 h-10 rounded-md">
    </div>
    <div>
      <h1 class="text-xl font-extrabold tracking-tight text-gray-900">SCARF</h1>
      <p class="text-[10px] text-blue-600 font-bold uppercase tracking-widest">SaaS Carbon-Aware Reasoning Framework</p>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto p-8 flex flex-col gap-8">

  <div id="errorBanner" class="hidden items-start gap-3 bg-red-50 border border-red-200 rounded-lg px-4 py-3 mb-5">
    <svg class="w-4 h-4 text-red-500 mt-0.5 flex-shrink-0" viewBox="0 0 16 16" fill="none">
      <circle cx="8" cy="8" r="7.25" stroke="currentColor" stroke-width="1.5"/>
      <path d="M8 4.5v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="8" cy="11" r="0.75" fill="currentColor"/>
    </svg>
    <div>
      <p class="text-sm font-semibold text-red-800 mb-1">Complete all required fields before executing</p>
      <ul id="errorList" class="text-sm text-red-700 list-disc pl-4 flex flex-col gap-0.5"></ul>
    </div>
  </div>

  <section class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">
    <label class="block mb-3 text-sm font-semibold text-gray-700">Architecture Description</label>
    <div class="flex gap-3 items-center">
      <div class="relative flex-1">
        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
          <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        </div>
        <label for="fileNameDisplay" class="hidden"></label><input id="fileNameDisplay" type="text" placeholder="Select UML Architecture (.uml, .uml2)..."
                                                    class="w-full pl-10 p-2.5 bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500" readonly>
      </div>
      <button id="browseFileBtn" class="px-5 py-2.5 btn-blue">
        Browse Model
      </button>
      <input type="file" accept=".uml, .uml2" id="fileInput" class="hidden">
    </div>
  </section>

  <section class="bg-white p-6 rounded-xl border border-gray-100 shadow-sm">

    <div class="flex items-center gap-3 mb-5 border-b border-gray-50 pb-4">
      <div class="w-1.5 h-6 bg-green-500 rounded-full"></div>
      <h2 class="font-bold text-gray-800 text-lg">Simulation Parameters</h2>
    </div>

    <div class="flex items-center gap-3 mb-5">
      <span class="text-xs font-semibold text-gray-700 uppercase tracking-wide whitespace-nowrap">Arrival process</span>
      <div class="flex-1 h-px bg-gray-200"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-7">
      <div class="flex flex-col gap-2">
        <label for="distSelect" class="text-sm font-semibold text-gray-600">Inter-arrival distribution</label>
        <select id="distSelect" class="h-11 bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block w-full px-4 transition-all">
          <option>Exponential</option>
          <option>Uniform</option>
          <option>Constant</option>
          <option>Erlang</option>
          <option>Log-normal</option>
        </select>
      </div>
      <div class="flex flex-col gap-2">
        <label id="param1Label" for="param1Field" class="text-sm font-semibold text-gray-600">Rate</label>
        <div class="relative">
          <input id="param1Field" type="number" step="0.01" min="0" placeholder="0.00"
                 class="h-11 bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block w-full px-4">
        </div>
      </div>
      <div class="flex flex-col gap-2">
        <label id="param2Label" for="param2Field" class="text-sm font-semibold text-gray-600 invisible">Placeholder</label>
        <input id="param2Field" type="number" step="0.01" min="0" placeholder="0.00"
               class="h-11 bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block w-full px-4 invisible">
      </div>
    </div>

    <div class="flex items-center gap-3 mb-5">
      <span class="text-xs font-semibold text-gray-700 uppercase tracking-wide whitespace-nowrap">Time &amp; period</span>
      <div class="flex-1 h-px bg-gray-200"></div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <div class="flex flex-col gap-2" th:replace="~{fragments/solar-map :: solarTimePicker(
          fieldId='startTime',
          label='Start time (UTC)',
          defaultValue='00:00'
      )}"></div>
      <div class="flex flex-col gap-2">
        <label for="duration" class="text-sm font-semibold text-gray-600">Duration (hours)</label>
        <input id="duration" type="number" min="1" max="24" step="1" value="1"
               class="h-11 bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block w-full px-4">
      </div>
      <div class="flex flex-col gap-2">
        <label for="refPeriod" class="text-sm font-semibold text-gray-600">Reference period</label>
        <select id="refPeriod"
                class="h-11 bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block w-full px-4 transition-all">
          <option value="Yearly">Yearly average</option>
          <option value="Q1">Q1 (Jan – Mar)</option>
          <option value="Q2">Q2 (Apr – Jun)</option>
          <option value="Q3">Q3 (Jul – Sep)</option>
          <option value="Q4">Q4 (Oct – Dec)</option>
        </select>
      </div>
    </div>

    <div class="flex items-center gap-3 mb-4 mt-7">
    <span class="text-xs font-semibold text-gray-700 uppercase tracking-wide whitespace-nowrap">
      Routing balance
    </span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <div class="stp-dial-wrap">

        <div class="stp-dial-side">
          <svg id="alphaDial" viewBox="-115 -115 230 125" width="200"
               style="overflow:visible;display:block">
            <defs>
              <linearGradient id="alphaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#3b82f6"/>
                <stop offset="100%" stop-color="#22c55e"/>
              </linearGradient>
            </defs>
            <path id="dialTrack" fill="none"
                  stroke="#e5e7eb" stroke-width="18" stroke-linecap="butt"
                  d="M -100 0 A 100 100 0 0 1 100 0"/>
            <path id="dialFill"  fill="none"
                  stroke="url(#alphaGrad)" stroke-width="18" stroke-linecap="butt" d=""/>
            <g id="dialTicks"></g>
            <line id="dialNeedle" x1="0" y1="0" x2="-82" y2="0"
                  stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
            <circle r="5" fill="#1f2937"/>
            <circle r="2.5" fill="white"/>
          </svg>
          <div class="stp-dial-poles">
            <span class="stp-dial-pole" style="color:#3b82f6">⚡ Perf</span>
            <span class="stp-dial-pole" style="color:#22c55e">Green 🌿</span>
          </div>
        </div>

        <div class="stp-dial-controls">
          <div>
            <div class="stp-dial-readout">
              <span class="stp-dial-value" id="alphaDisplay">0.50</span>
              <span class="stp-dial-unit">α</span>
            </div>
            <div class="stp-dial-mode" id="alphaMode">Balanced</div>
          </div>

          <div class="stp-dial-slider-row">
            <span>0.0</span>
            <label for="alphaSlider" class="hidden">Alpha value</label>
            <input type="range" id="alphaSlider" min="0" max="100" step="1" value="50">
            <span style="text-align:right">1.0</span>
          </div>

          <div class="stp-dial-presets">
            <button type="button" class="stp-dial-preset"
                    onclick="AlphaDial.set(0)">Low latency priority</button>
            <button type="button" class="stp-dial-preset active"
                    onclick="AlphaDial.set(50)">Balanced</button>
            <button type="button" class="stp-dial-preset"
                    onclick="AlphaDial.set(100)">Carbon reduction priority</button>
          </div>

          <input type="hidden" id="alphaValue" name="alpha" value="0.50">
        </div>
      </div>
  </section>

  <section class="bg-gray-900 p-8 rounded-2xl shadow-xl text-white">
    <div class="flex flex-col gap-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <label class="text-sm font-semibold text-gray-400" for="repetitions">Simulation Repetitions:</label>
          <input id="repetitions" type="number" value="20" min="2" max="100"
                 class="w-20 bg-gray-800 border-none text-white font-bold rounded-lg focus:ring-2 focus:ring-blue-500 p-2">
        </div>
        <button id="runBtn" class="px-8 py-3 btn-green">
          Execute Simulation
        </button>
      </div>

      <div class="space-y-3">
        <div class="flex justify-between items-end">
          <span id="progress-label" class="text-xs font-bold uppercase tracking-tighter text-blue-400">System Ready</span>
          <span id="progress-percent" class="text-2xl font-black text-white">0%</span>
        </div>
        <div class="w-full bg-gray-800 rounded-full h-3 overflow-hidden">
          <div id="progress-bar"
               class="bg-blue-500 h-full rounded-full transition-all duration-700 ease-out shadow-[0_0_15px_rgba(59,130,246,0.5)]"
               style="width: 0">
          </div>
        </div>
      </div>
    </div>
  </section>

</main>

<script th:src="@{/js/vendor/flowbite.min.js}"></script>
</body>
</html>
