<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/images/favicon.ico}" rel="icon" type="image/x-icon"/>
    <link th:href="@{/images/favicon.png}" rel="icon" type="image/png" sizes="32x32"/>
    <link th:href="@{/css/output.css}" rel="stylesheet"/>
    <script th:src="@{/js/scarf.js}"></script>
    <title>SCARF</title>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

<header class="bg-white shadow p-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
        <img th:src="@{/images/favicon.png}" alt="SCARF Logo" class="w-12 h-12 rounded">
        <h1 class="text-2xl font-bold text-gray-800">SCARF</h1>
    </div>
</header>

<main class="flex-1 p-6 flex flex-col gap-6">

    <!-- File Selection -->
    <div class="flex gap-2 items-center">
        <label for="fileNameDisplay"></label><input id="fileNameDisplay" type="text" placeholder="Select UML Architecture..."
                                             class="flex-1 p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" readonly>
        <button id="browseFileBtn"
                class="px-4 py-2 btn-blue">Browse UML</button>
        <input type="file" accept=".uml, .uml2" id="fileInput" class="hidden" hidden aria-hidden="true">
    </div>

    <!-- Distribution Panel -->
    <div class="p-4 border rounded shadow bg-white">
        <h2 class="font-semibold text-gray-700 mb-4">Simulation Parameters</h2>
        <div class="grid grid-cols-7 gap-4 items-center">
            <label for="distSelect" class="col-span-1 text-gray-600 text-center">Inter-arrival Distribution:</label>
            <select id="distSelect" class="col-span-2 p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option>Exponential</option>
                <option>Uniform</option>
                <option>Constant</option>
                <option>Erlang</option>
                <option>Log-normal</option>
            </select>

            <label id="param1Label" for="param1Field" class="col-span-1 text-gray-600 text-center">Rate:</label>
            <input id="param1Field" type="number" step="0.01" min="0" class="col-span-1 p-2 border rounded">

            <label id="param2Label" for="param2Field" class="col-span-1 text-gray-600 invisible">Param2:</label>
            <input id="param2Field" type="number" step="0.01" min="0" class="col-span-1 p-2 border rounded invisible">
        </div>
    </div>

    <!-- Repetitions + Run Button -->
    <div class="flex gap-4 items-center">
        <label class="text-gray-700" for="repetitions">Number of simulation repetitions:</label>
        <input id="repetitions" type="number" value="20" min="2" max="100" class="w-20 p-2 border rounded">
        <button id="runBtn"
                class="ml-auto px-6 py-2 btn-green">
            Create and Run Simulation
        </button>
    </div>

    <!-- Console Output -->
    <label for="consoleOutput"></label><textarea id="consoleOutput" readonly
                                                 class="flex-1 p-2 border border-gray-300 rounded bg-black text-green-400 font-mono resize-none h-64"></textarea>

</main>

<script th:src="@{/js/flowbite.min.js}"></script>
</body>
</html>
