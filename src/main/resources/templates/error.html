<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link th:href="@{/images/favicon.ico}" rel="icon" type="image/x-icon"/>
    <link th:href="@{/images/favicon.png}" rel="icon" type="image/png" sizes="32x32"/>
    <link th:href="@{/css/output.css}" rel="stylesheet"/>
    <title>Something went wrong</title>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-white border-b border-gray-100 p-4 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center gap-3">
        <div class="p-1.5 bg-blue-50 rounded-lg">
            <img th:src="@{/images/favicon.png}" alt="SCARF Logo" class="w-10 h-10 rounded-md">
        </div>
        <div>
            <h1 class="text-xl font-extrabold tracking-tight text-gray-900">SCARF</h1>
            <p class="text-[10px] text-blue-600 font-bold uppercase tracking-widest">SaaS Carbon-Aware Reasoning Framework</p>
        </div>
    </div>
    <div class="flex items-center gap-4">
        <a th:href="@{/}" class="text-sm font-semibold text-blue-600 hover:text-blue-800 transition-colors">← Back to Home</a>
    </div>
</header>

<main class="flex-grow flex items-center justify-center p-8">
    <section class="max-w-md w-full bg-white p-10 rounded-2xl border border-gray-100 shadow-xl text-center">

        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-50 mb-6">
            <svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>

        <!--/*@thymesVar id="errorHeader" type="text"*/-->
        <h2 class="text-2xl font-black text-gray-900 mb-2" th:text="${errorHeader != null ? errorHeader : 'Resource Not Found'}">Resource Not Found</h2>

        <!--/*@thymesVar id="errorMessage" type="text"*/-->
        <p class="text-gray-500 text-sm mb-8" th:text="${errorMessage != null ? errorMessage : 'The page you are looking for does not exist.'}">
            The page you are looking for does not exist.
        </p>
    </section>
</main>
</body>
</html>
